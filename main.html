<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Portofolio Proyek - Modul 4</title>

    <style>
        /* Reset CSS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
        }

        /* Tampilan halaman */
        body {
            background-color: #f1f5f9;
            color: #0f172a;
            padding: 30px 15px;
        }

        /* Kontainer utama */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Judul dan subtitle */
        h1 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Grid statistik */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Kartu statistik */
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* Grup tombol filter */
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Tombol filter */
        .btn-filter {
            padding: 8px 16px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-filter.active,
        .btn-filter:hover {
            background: #1e3a8a;
            color: #ffffff;
            border-color: #1e3a8a;
        }

        /* Kartu proyek */
        .project-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            background: #ffffff;
            transition: transform 0.15s ease;
        }

        .project-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* Informasi proyek */
        .project-info h4 {
            font-size: 16px;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .project-category {
            display: inline-block;
            font-size: 12px;
            color: #0284c7;
            background: #e0f2fe;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .project-budget {
            font-size: 14px;
            color: #334155;
            font-weight: 600;
        }

        /* Badge status proyek */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-pending {
            background: #fef9c3;
            color: #854d0e;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Judul dashboard -->
        <h1>Portofolio Proyek</h1>
        <p class="subtitle">
            Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM
        </p>

        <!-- Kartu ringkasan statistik -->
        <div class="stats-grid">

            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>

            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>

        </div>

        <!-- Tombol filter kategori -->
        <div class="filter-group">
            <button
                class="btn-filter active"
                data-category="Semua"
            >
                Semua Proyek
            </button>

            <button
                class="btn-filter"
                data-category="Web App"
            >
                Web App
            </button>

            <button
                class="btn-filter"
                data-category="Desktop App"
            >
                Desktop App
            </button>

            <button
                class="btn-filter"
                data-category="Mobile App"
            >
                Mobile App
            </button>
        </div>

        <!-- Kontainer daftar proyek -->
        <div id="project-list"></div>

    </div>

    <!-- File JavaScript eksternal -->
    <script src="main.js"></script>
</body>
</html>
